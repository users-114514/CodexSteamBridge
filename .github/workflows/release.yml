name: Windows build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexSteamBridge-v0.1.0
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CodexSteamBridge-v0.1.0
          path: dist
      - name: Create experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "CodexSteamBridge $RELEASE_TAG (experimental)" --prerelease --generate-notes
